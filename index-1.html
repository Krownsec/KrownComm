<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=UnifrakturMaguntia&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#060202;
    --char:#0c0605;
    --ember-deep:#6e0f0f;
    --ember-core:#d81e05;
    --ember-bright:#ff5a1f;
    --ash:#cdbdb2;
    --ash-dim:#7c6a63;
    --crack:#3a0d0d;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html{
    scroll-behavior:smooth;
  }

  body{
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(216,30,5,0.14), transparent 60%),
      radial-gradient(ellipse 80% 60% at 50% 100%, rgba(110,15,15,0.10), transparent 65%),
      var(--void);
    color:var(--ash);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  /* charred crack texture overlay */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      repeating-linear-gradient(115deg, rgba(216,30,5,0.025) 0px, rgba(216,30,5,0.025) 1px, transparent 1px, transparent 90px),
      repeating-linear-gradient(25deg, rgba(216,30,5,0.02) 0px, rgba(216,30,5,0.02) 1px, transparent 1px, transparent 130px);
    pointer-events:none;
    z-index:0;
  }

  /* vignette */
  body::after{
    content:"";
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse 70% 70% at 50% 40%, transparent 40%, rgba(0,0,0,0.75) 100%);
    pointer-events:none;
    z-index:0;
  }

  .wrap{
    position:relative;
    z-index:2;
    max-width:460px;
    margin:0 auto;
    padding:64px 24px 48px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  /* --- emblem / signature element --- */
  .emblem-stage{
    position:relative;
    width:200px;
    height:200px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:28px;
  }

  .emblem-glow{
    position:absolute;
    width:280px;
    height:280px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,90,31,0.35) 0%, rgba(216,30,5,0.14) 38%, transparent 70%);
    filter:blur(6px);
    animation:pulse 4.5s ease-in-out infinite;
    z-index:0;
  }

  @keyframes pulse{
    0%,100%{transform:scale(0.94);opacity:0.75;}
    50%{transform:scale(1.06);opacity:1;}
  }

  .emblem-ring{
    position:relative;
    width:196px;
    height:196px;
    border-radius:50%;
    overflow:hidden;
    border:1px solid rgba(216,30,5,0.55);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.6),
      0 0 40px rgba(216,30,5,0.35),
      0 0 90px rgba(216,30,5,0.15),
      inset 0 0 30px rgba(0,0,0,0.6);
    z-index:1;
  }

  .emblem-ring img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:saturate(1.05) contrast(1.05);
  }

  .spark{
    position:absolute;
    top:38%;
    left:50%;
    width:5px;
    height:5px;
    background:#fff;
    border-radius:50%;
    box-shadow:0 0 12px 4px rgba(255,180,120,0.9), 0 0 30px 10px rgba(216,30,5,0.5);
    transform:translate(-50%,-50%);
    animation:flicker 2.6s ease-in-out infinite;
    z-index:2;
  }

  @keyframes flicker{
    0%,100%{opacity:0.6;transform:translate(-50%,-50%) scale(0.85);}
    45%{opacity:1;transform:translate(-50%,-50%) scale(1.25);}
    60%{opacity:0.8;}
  }

  /* --- identity --- */
  .brandmark{
    font-family:'UnifrakturMaguntia', cursive;
    font-size:15px;
    letter-spacing:3px;
    color:var(--ember-bright);
    text-transform:lowercase;
    opacity:0.8;
    margin-bottom:6px;
  }

  h1{
    font-family:'Cinzel', serif;
    font-weight:900;
    font-size:clamp(40px, 11vw, 54px);
    letter-spacing:10px;
    line-height:1;
    background:linear-gradient(180deg, #fff2ea 0%, #ff8a4d 35%, var(--ember-core) 75%, var(--ember-deep) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 46px rgba(216,30,5,0.35);
    margin-bottom:12px;
  }

  .tagline{
    font-family:'Cinzel', serif;
    font-size:12.5px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:var(--ash-dim);
    margin-bottom:6px;
  }

  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    max-width:220px;
    margin:22px 0 34px;
    color:var(--ember-deep);
  }
  .divider .line{
    flex:1;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--ember-deep) 50%, transparent);
  }
  .divider .glyph{
    font-size:13px;
    color:var(--ember-core);
    transform:rotate(0deg);
  }

  /* --- link buttons --- */
  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .link-btn{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:16px 22px;
    background:linear-gradient(180deg, rgba(20,8,8,0.9), rgba(10,4,4,0.95));
    border:1px solid rgba(216,30,5,0.28);
    border-radius:3px;
    color:var(--ash);
    font-family:'Cinzel', serif;
    font-weight:600;
    font-size:13.5px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    text-decoration:none;
    overflow:hidden;
    isolation:isolate;
    transition:border-color 0.35s ease, color 0.35s ease, transform 0.2s ease, box-shadow 0.35s ease;
  }

  .link-btn::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(90deg, transparent, rgba(216,30,5,0.22), transparent);
    transform:translateX(-110%);
    transition:transform 0.6s ease;
    z-index:-1;
  }

  .link-btn .rune{
    font-size:11px;
    color:var(--ember-deep);
    transition:color 0.35s ease, text-shadow 0.35s ease;
  }

  .link-btn:hover, .link-btn:focus-visible{
    border-color:var(--ember-core);
    color:#fff3ec;
    box-shadow:0 0 24px rgba(216,30,5,0.35), inset 0 0 18px rgba(216,30,5,0.12);
    transform:translateY(-1px);
    outline:none;
  }
  .link-btn:hover::before, .link-btn:focus-visible::before{
    transform:translateX(0%);
  }
  .link-btn:hover .rune, .link-btn:focus-visible .rune{
    color:var(--ember-bright);
    text-shadow:0 0 8px rgba(255,90,31,0.8);
  }

  .link-btn:active{
    transform:translateY(0px) scale(0.99);
  }

  footer{
    margin-top:44px;
    font-size:10.5px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--ash-dim);
    opacity:0.55;
  }

  @media (prefers-reduced-motion: reduce){
    .emblem-glow, .spark{animation:none;}
  }

  @media (max-width:380px){
    h1{letter-spacing:7px;}
    .emblem-stage{width:170px;height:170px;}
    .emblem-glow{width:230px;height:230px;}
    .emblem-ring{width:166px;height:166px;}
  }

  .watermark{
    position:fixed;
    bottom:10px;
    right:12px;
    z-index:1;
    font-family:'Inter', sans-serif;
    font-size:10px;
    letter-spacing:0.5px;
    color:rgba(205,189,178,0.10);
    text-decoration:none;
    pointer-events:none;
  }
</style>
</head>
